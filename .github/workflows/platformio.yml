name: PlatformIO

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'test/**'
      - 'examples/**'
      - 'platformio.ini'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run PlatformIO unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip3 install platformio

      - name: Run unit tests
        run: pio test -e native

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip3 install platformio

      - name: Build all examples for all environments
        run: |
          ENVS=$(grep -E '^\[env:' platformio.ini | sed -E 's/^\[env:(.*)\]/\1/' | tr '\n' ' ')
          for env in $ENVS; do
            echo "Building examples for environment: $env"
            ./examples/build.sh "$env"
          done
