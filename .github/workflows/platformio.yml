name: PlatformIO

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run PlatformIO unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip3 install platformio

      - name: Run unit tests
        run: pio test -c platformio_ci.ini -e native_ci

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ESP32, ATMEGA328P, SAMD21G18A]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip3 install platformio

      - name: Build all examples
        run: ./examples/build.sh ${{ matrix.env }}
