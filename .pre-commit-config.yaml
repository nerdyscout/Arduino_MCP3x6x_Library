# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-json

  - repo: https://github.com/bmorcos/pre-commit-hooks-cpp
    rev: 9a5aa38207bf557961110d6a4f7e3a9d352911f9
    hooks:
    - id: clang-format
      args: ["-style=file"]
    -   id: cpplint
    -   id: cppcheck

  - repo: https://github.com/fsfe/reuse-tool
    rev: v0.13.0
    hooks:
    - id: reuse

  - repo: local
    hooks:
    - id: native-tests
      name: Run native unit tests
      entry: pio test -e native_ci --project-conf platformio_ci.ini
      language: system
      pass_filenames: false
      always_run: true
    - id: test-coverage-floor
      name: Enforce test coverage floor (80%)
      entry: bash -c 'pio test -e native_ci --project-conf platformio_ci.ini > /dev/null 2>&1 && gcovr --filter src/Arduino_MCP3x6x_Library.hpp --print-summary --fail-under-line 80 2>/dev/null || (echo "Test coverage floor not met or coverage tooling unavailable" && exit 1)'
      language: system
      pass_filenames: false
      always_run: true
